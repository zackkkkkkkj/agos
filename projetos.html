<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetos — agos dsgn</title>
  
  <!-- Favicon corrigido -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/Ativo%203.png">
  <link rel="shortcut icon" type="image/png" href="./images/Ativo%203.png">
  <link rel="apple-touch-icon" href="./images/Ativo%203.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Alex+Brush&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ededed;
      color: #572c19;
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* Estrelas Flutuantes */
    #stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      color: #98cdeb;
      user-select: none;
      animation: floatStar 4s ease-in-out infinite alternate, fadeStar 3s ease-in-out infinite alternate;
    }

    @keyframes floatStar {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-18px) rotate(25deg); }
    }

    @keyframes fadeStar {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    /* Faixa Topo */
    .top-ticker {
      background-color: #98cdeb;
      overflow: hidden;
      white-space: nowrap;
      padding: 6px 0;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: marquee 25s linear infinite;
    }

    .ticker-content {
      display: flex;
      gap: 20px;
      padding-right: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #160a05;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Container Principal */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px 60px 20px;
      position: relative;
      z-index: 2;
    }

    .back-link {
      display: inline-block;
      color: #572c19;
      text-decoration: none;
      font-family: 'Blackadder ITC', 'Alex Brush', cursive;
      font-size: 1.6rem;
      margin-bottom: 20px;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 0.7;
    }

    /* LAYOUT DESKTOP (Grid 2 colunas reais) */
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 30px;
      align-items: start;
    }

    .projects-column {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .project-card {
      width: 100%;
      height: 280px;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(22, 10, 5, 0.05);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .project-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
      transition: filter 0.4s ease, transform 0.4s ease;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(22, 10, 5, 0.12);
    }

    .project-card:hover img {
      filter: grayscale(0%);
    }

    /* Estrelas Divisórias */
    .divider-star {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .desktop-star {
      align-self: center;
      margin-top: 100px;
    }

    .mobile-star {
      display: none;
    }

    .divider-star svg {
      width: 100%;
      height: 100%;
      fill: #572c19;
    }

    /* Modais */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(22, 10, 5, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 850px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      background-color: #ffffff;
      border-radius: 12px;
    }

    .modal-content img {
      width: 100%;
      height: auto;
      display: block;
    }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 30px;
      background: #ffffff;
      color: #572c19;
      border: none;
      font-size: 1.5rem;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* REGRA MOBILE (Força a ordem exata vertical) */
    @media (max-width: 768px) {
      .projects-grid {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .projects-column {
        width: 100%;
        gap: 20px;
      }

      .desktop-star {
        display: none;
      }

      .mobile-star {
        display: flex;
        margin: 10px auto;
        width: 50px;
        height: 50px;
      }

      .project-card {
        height: 220px;
      }
    }
  </style>
</head>
<body>

  <div id="stars-container"></div>

  <div class="top-ticker">
    <div class="ticker-track">
      <div class="ticker-content">
        <span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span>
      </div>
      <div class="ticker-content">
        <span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span><span>AGOS DSGN &#10022;</span>

  </div>

      </div>

      <!-- COLUNA DIREITA -->
      <div class="projects-column">
        <!-- Estrela Visível Apenas no Mobile -->
        <div class="divider-star mobile-star">
          <svg viewBox="0 0 100 100"><path d="M50 0 L55 35 L90 10 L65 45 L100 50 L65 55 L90 90 L55 65 L50 100 L45 65 L10 90 L35 55 L0 50 L35 45 L10 10 L45 35 Z"/></svg>

  <!-- MODAL DAVIPAN -->

      <img src="./images/foto7.jpg.png" alt="Davipan 7">
      <img src="./images/foto8.jpg.png" alt="Davipan 8">
      <img src="./images/foto9.jpg.png" alt="Davipan 9">
      <img src="./images/foto10.jpg.png" alt="Davipan 10">
      <img src="./images/fot11.jpg.png" alt="Davipan 11">

  <!-- MODAL CALIGGIO -->

    <div class="modal-content">

    </div>
  </div>

  <!-- MODAL STUDIO -->
  <div class="modal-overlay" id="modalStudio" onclick="closeModalOnOuterClick(event, 'modalStudio')">
    <button class="close-btn" onclick="closeModal('modalStudio')">&times;</button>
    <div class="modal-content">
      <img src="./images/studio%201.PNG" alt="Studio 1">
      <img src="./images/studio%20capa%20e%20slide%202.PNG" alt="Studio 2">
      <img src="./images/studio%203.png" alt="Studio 3">
      <img src="./images/studio%204.png" alt="Studio 4">
    </div>
  </div>

  <script>
    const container = document.getElementById('stars-container');
    const starIcons = ['✦', '✧', '✶', '✵'];

    for (let i = 0; i < 30; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      star.innerHTML = starIcons[Math.floor(Math.random() * starIcons.length)];
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.fontSize = (Math.random() * 14 + 12) + 'px';
      star.style.animationDelay = (Math.random() * 4) + 's';
      star.style.animationDuration = (Math.random() * 3 + 3) + 's';
      container.appendChild(star);
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function closeModalOnOuterClick(event, id) {
      if (event.target.classList.contains('modal-overlay')) {
        closeModal(id);
      }
    }
  </script>

</body>
</html>
