    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ededed; /* Ice */
      color: #572c19; /* Brown Sugar */
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Container de Estrelas Arrastáveis */
    #stars-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    /* Estrelas Azuis Arrastáveis */
    .draggable-star {
      position: absolute;
      color: #98cdeb; /* Baby Blue */
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      transition: color 0.2s ease, transform 0.1s ease;
      z-index: 9999;
    }

    .draggable-star:hover {
      color: #572c19;
    }

    .draggable-star.dragging {
      cursor: grabbing;
      color: #572c19;
      transform: scale(1.4);
      z-index: 100000 !important;
    }

    /* Faixa Superior Infinita (#98cdeb) */
    .top-ticker {
      background-color: #98cdeb;
      overflow: hidden;
      white-space: nowrap;
      padding: 6px 0;
      width: 100%;
      position: relative;
      z-index: 200;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: marquee 25s linear infinite;
    }

    .ticker-content {
      display: flex;
      gap: 20px;
      padding-right: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #160a05;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Cabecalho da pagina de Projetos */
    .header-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 20;
    }

    .back-home {
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .back-home img {
      width: 140px;
      height: auto;
      display: block;
    }

    .back-home:hover {
      transform: scale(1.05);
      opacity: 0.85;
    }

    .social-bar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social-bar a {
      color: #572c19;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .social-bar a:hover {
      opacity: 0.7;
    }

    .social-bar svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-budget {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid #572c19;
      padding: 6px 16px;
      border-radius: 20px;
      line-height: 1;
    }

    .btn-budget svg {
      width: 18px;
      height: 18px;
    }

    /* Titulo Projetos com Estrela Central */
    .page-title-section {
      text-align: center;
      margin: 30px 0 40px 0;
      position: relative;
      z-index: 20;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: lowercase;
      color: #572c19;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .center-star {
      color: #572c19;
      font-size: 2.5rem;
      line-height: 1;

    /* Grid de Projetos */
    .projects-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 80px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      position: relative;
      z-index: 20;
    }

    .project-card {
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      background-color: transparent;
    }

    .project-card:hover {
      transform: translateY(-5px);
    }

    .project-thumb {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      object-fit: contain;
    }

    /* MODAL DE GALERIA / SLIDES */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(22, 10, 5, 0.85);
      z-index: 200000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 900px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      color: #ededed;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      font-size: 1.8rem;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s ease;
      user-select: none;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .prev-btn { left: -60px; }
    .next-btn { right: -60px; }

    @media (max-width: 850px) {
      .header-bar {
        flex-direction: column;
        gap: 15px;
      }

      .prev-btn { left: 10px; }
      .next-btn { right: 10px; }
    }

  <script>
    /* Estrelas Arrastáveis */
    const container = document.getElementById('stars-container');
    const starIcons = ['✦', '✧', '✶', '✵'];
    
    function makeDraggable(el) {
      let isDragging = false;
      let startX, startY, startLeft, startTop;

      el.addEventListener('pointerdown', (e) => {
        isDragging = true;
        el.classList.add('dragging');

        startX = e.clientX;
        startY = e.clientY;

        const rect = el.getBoundingClientRect();
        startLeft = rect.left + window.scrollX;
        startTop = rect.top + window.scrollY;

        el.style.left = startLeft + 'px';
        el.style.top = startTop + 'px';

        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener('pointermove', (e) => {
        if (!isDragging) return;

        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;

        el.style.left = (startLeft + deltaX) + 'px';
        el.style.top = (startTop + deltaY) + 'px';
      });

      const stopDrag = (e) => {
        if (!isDragging) return;
        isDragging = false;
        el.classList.remove('dragging');

        try {
          el.releasePointerCapture(e.pointerId);
        } catch (err) {}
      };

      el.addEventListener('pointerup', stopDrag);
      el.addEventListener('pointercancel', stopDrag);
    }

    const isMobile = window.innerWidth <= 850;
    const totalStars = isMobile ? 15 : 30;

    for (let i = 0; i < totalStars; i++) {
      const star = document.createElement('span');
      star.className = 'draggable-star';
      star.innerHTML = starIcons[Math.floor(Math.random() * starIcons.length)];
      
      const initialX = Math.random() * (window.innerWidth - 60);
      const initialY = Math.random() * (document.body.scrollHeight - 60);
      
      star.style.left = initialX + 'px';
      star.style.top = initialY + 'px';
      star.style.fontSize = (Math.random() * 18 + 18) + 'px';

      makeDraggable(star);
      container.appendChild(star);
    }

    /* Dados dos Projetos com Galeria de Slides */
    const projectsData = [
      // Index 0: Davipan
      { images: ['images/Ativo%2014.png'] },
      
      // Index 1: Projeto Studio (Novo - com múltiplos slides)
      {
        images: [
          'images/studio%201.PNG',
          'images/studio%20capa%20e%20slide%202.PNG',
          'images/studio%203.png',
          'images/studio%204.png'
        ]
      },
      
      // Demais Projetos
      { images: ['images/Ativo%2015.png'] },
      { images: ['images/Ativo%2016.png'] },
      { images: ['images/Ativo%2017.png'] },
      { images: ['images/Ativo%2018.png'] }
    ];

    let currentProjectIndex = 0;
    let currentSlideIndex = 0;

    function openGallery(projectIndex) {
      currentProjectIndex = projectIndex;
      currentSlideIndex = 0;
      updateModalImage();
      document.getElementById('galleryModal').classList.add('active');
    }

    function closeGallery() {
      document.getElementById('galleryModal').classList.remove('active');
    }

    function changeSlide(direction) {
      const slides = projectsData[currentProjectIndex].images;
      if (slides.length <= 1) return;
      currentSlideIndex = (currentSlideIndex + direction + slides.length) % slides.length;
      updateModalImage();
    }

    function updateModalImage() {
      const slides = projectsData[currentProjectIndex].images;
      const img = document.getElementById('modalImage');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      img.src = slides[currentSlideIndex];

      if (slides.length <= 1) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
      } else {
        prevBtn.style.display = 'block';
        nextBtn.style.display = 'block';
      }
    }
  </script>
